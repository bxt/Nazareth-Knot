<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" xml:lang="en" viewBox="-250 -250 500 500">
  <defs>
    <style>
      
        .color-a { fill: #eb076a; }

        .color-c { fill: #521075; }
      
        .color-d { fill: #a91b4a; }
      
    </style>
    
      <path id="path-0" d="M 0 -50 l 43.301 -25 l 43.301 25 l 0 50 l -43.301 25 l 0 -50 Z" />
    
      <path id="path-1" d="M 43.301 -75 l 0 -50 l 86.603 50 l 0 100 l -43.301 -25 l 0 -50 Z" />

    <g style="transform:rotate(30deg);">
